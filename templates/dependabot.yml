version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    # Wait a week before proposing a new version, so compromised releases are usually pulled first.
    # Cooldown applies to version updates only; security updates are not delayed.
    cooldown: { default-days: 7 }
  # Uncomment/add the ecosystems your project uses:
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7 }
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7 }
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   cooldown: { default-days: 7 }
