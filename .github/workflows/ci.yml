name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: for s in scripts/*.sh; do bash -n "$s" || exit 1; done
      - run: shellcheck --severity=warning scripts/*.sh   # preinstalled on ubuntu-latest
      - run: scripts/check-kb.sh
      - run: scripts/audit.sh .
