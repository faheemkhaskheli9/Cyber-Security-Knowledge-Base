name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash -n scripts/audit.sh && bash -n scripts/bootstrap-project.sh && bash -n scripts/check-kb.sh
      - run: scripts/check-kb.sh
      - run: scripts/audit.sh . || true
